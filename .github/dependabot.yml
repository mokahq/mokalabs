version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      ai-sdk: { patterns: ["ai", "@ai-sdk/*"] }
      mcp: { patterns: ["@modelcontextprotocol/*"] }
      ui: { patterns: ["react", "react-dom", "@types/react*", "vite", "@vitejs/*", "tailwindcss", "@tailwindcss/*", "lucide-react"] }
      # Build and test tooling: one PR instead of one per tool.
      dev-tools: { dependency-type: development, patterns: ["*"], exclude-patterns: ["typescript", "@types/react*", "vite", "@vitejs/*"] }
    ignore:
      # TypeScript 7 (the Go port) breaks tsup's declaration build; revisit when tsup supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      docker-actions: { patterns: ["docker/*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      # Stay on even-numbered (LTS) Node releases.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
