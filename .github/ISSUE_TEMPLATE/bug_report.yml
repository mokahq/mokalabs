name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what you saw. A trace from the inspector (⬇ Download trace) helps a lot — remove anything sensitive first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Moka version
      placeholder: npx @mokalabs/sandbox --version
  - type: input
    id: env
    attributes:
      label: OS / Node / provider / MCP server
