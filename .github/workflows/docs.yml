name: Docs

on:
  push:
    branches: [main]
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site's real address: the custom domain (base "/") or <owner>.github.io/<repo>.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build docs
        run: pnpm --filter @mokalabs/docs build
        env:
          # From the Pages settings (custom domain included). Repository variables DOCS_SITE / DOCS_BASE override them.
          DOCS_SITE: ${{ vars.DOCS_SITE || steps.pages.outputs.origin }}
          DOCS_BASE: ${{ vars.DOCS_BASE || steps.pages.outputs.base_path || '/' }}
          ASTRO_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
