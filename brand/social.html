<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:radial-gradient(900px 500px at 78% 60%,rgba(235,154,92,.22),transparent 60%),linear-gradient(180deg,#221815,#0f0b0a);color:#f3ece6;
       display:flex;align-items:center;gap:56px;padding:0 90px;box-sizing:border-box}
  .copy{flex:1}
  .word{font-size:112px;font-weight:800;letter-spacing:-4px;line-height:1}
  .word span{background:linear-gradient(135deg,#f8c47e,#d97a38);-webkit-background-clip:text;color:transparent}
  .tag{font-size:40px;font-weight:600;margin-top:22px;line-height:1.2}
  .sub{font-size:26px;color:#a8998f;margin-top:18px}
  code{display:inline-block;margin-top:34px;font:500 28px ui-monospace,SFMono-Regular,Menlo,monospace;background:#1c1512;border:1px solid #3a312d;border-radius:14px;padding:14px 22px;color:#f8c47e}
  img{width:400px;height:400px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))}
</style></head><body>
  <div class="copy">
    <div class="word"><span>moka</span></div>
    <div class="tag">Any LLM. Any MCP server.<br>Any skill. One command.</div>
    <div class="sub">Tiny arms. Strong brew. ☕</div>
    <code>npx @mokalabs/sandbox</code>
  </div>
  <img src="moka-dino.svg">
</body></html>
