<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 128" role="img" aria-label="Moka the dino, sipping coffee">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8c47e"/>
      <stop offset="1" stop-color="#d97a38"/>
    </linearGradient>
    <radialGradient id="flame" cx=".35" cy=".5" r=".65">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8552b"/>
    </radialGradient>
  </defs>
  <style>
    svg { overflow: visible; }
    .b, .tail, .arm, .head, .eye, .steam path, .fire, .puff, .mouth-open, .smile { transform-box: view-box; }
    .b { animation: breathe 3.2s ease-in-out infinite; transform-origin: 54px 110px; }
    .tail { animation: wag 2.6s ease-in-out infinite; transform-origin: 44px 98px; }
    .head { animation: head 16s ease-in-out infinite; transform-origin: 62px 70px; }
    .arm { animation: sip 16s ease-in-out infinite; transform-origin: 70px 83px; }
    .eye { animation: blink 4.4s infinite; transform-origin: 88px 40px; }
    .steam path { animation: steam 2.4s ease-in-out infinite; opacity: 0; }
    .steam path:nth-child(2) { animation-delay: 1.2s; }
    .steam { animation: steamgate 16s linear infinite; }
    .smile { animation: smile 16s linear infinite; }
    .mouth-open { animation: mouth 16s linear infinite; opacity: 0; }
    .fire { animation: firegate 16s linear infinite; opacity: 0; }
    .puff { animation: puff 16s ease-out infinite; transform-origin: 114px 52px; opacity: 0; }
    .puff:nth-child(2) { animation-name: puff2; }
    .puff:nth-child(3) { animation-name: puff3; }
    .puff:nth-child(4) { animation-name: puff4; }

    /* Click (in the app): jump straight to the fire part of the cycle, once. */
    .roar .head, .roar .smile, .roar .mouth-open, .roar .fire, .roar .puff { animation-delay: -11.2s; animation-iteration-count: 1; }

    @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.03); } }
    @keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 94%, 96% { transform: scaleY(.08); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(3px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-7px); } }
    /* hide steam while the cup is at the mouth */
    @keyframes steamgate { 0%, 22%, 44%, 100% { opacity: 1; } 26%, 40% { opacity: 0; } }
    /* sip: 25% → 40% */
    @keyframes sip { 0%, 22%, 44%, 100% { transform: rotate(0deg); } 28%, 38% { transform: rotate(-34deg); } }
    /* head dips for the sip, rears back for the fire (70% → 82%) */
    @keyframes head { 0%, 22%, 44%, 66%, 86%, 100% { transform: rotate(0deg); } 28%, 38% { transform: rotate(8deg); } 70% { transform: rotate(-6deg); } 74%, 80% { transform: rotate(3deg); } }
    @keyframes smile { 0%, 71%, 83%, 100% { opacity: 1; } 72%, 82% { opacity: 0; } }
    @keyframes mouth { 0%, 71%, 83%, 100% { opacity: 0; } 72%, 82% { opacity: 1; } }
    @keyframes firegate { 0%, 71%, 86%, 100% { opacity: 0; } 72%, 84% { opacity: 1; } }
    @keyframes puff  { 0%, 72% { opacity: 0; transform: translate(0, 0) scale(.3); } 73.5% { opacity: 1; } 80% { opacity: 1; transform: translate(26px, -3px) scale(1.6); } 84% { opacity: 0; transform: translate(34px, -5px) scale(1.8); } 100% { opacity: 0; } }
    @keyframes puff2 { 0%, 72.5% { opacity: 0; transform: translate(0, 0) scale(.3); } 74% { opacity: 1; } 81% { opacity: 1; transform: translate(22px, 7px) scale(1.4); } 85% { opacity: 0; transform: translate(30px, 9px) scale(1.5); } 100% { opacity: 0; } }
    @keyframes puff3 { 0%, 73% { opacity: 0; transform: translate(0, 0) scale(.3); } 74.5% { opacity: 1; } 81% { opacity: 1; transform: translate(30px, -10px) scale(1.2); } 86% { opacity: 0; transform: translate(40px, -14px) scale(1.3); } 100% { opacity: 0; } }
    @keyframes puff4 { 0%, 72% { opacity: 0; transform: translate(0, 0) scale(.4); } 73% { opacity: 1; } 81% { opacity: 1; transform: translate(12px, 1px) scale(1.3); } 84% { opacity: 0; transform: translate(16px, 1px) scale(1.2); } 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .steam path { opacity: .85; }
    }
  </style>

  <!-- tail -->
  <path class="tail" d="M36 88 C 24 90, 16 96, 12 104 C 14 107, 20 106, 26 104 C 32 102, 40 100, 46 100 Z" fill="url(#skin)"/>

  <g class="b">
    <!-- back spikes -->
    <path d="M33 72 l5 -9 l5 9 z M42 62 l6 -9 l5 10 z M54 54 l6 -9 l5 10 z" fill="#9a4f23"/>
    <!-- body -->
    <ellipse cx="54" cy="86" rx="25" ry="21" fill="url(#skin)"/>
    <!-- belly -->
    <path d="M58 76 C 70 74, 76 84, 74 94 C 72 102, 62 106, 56 102 C 52 94, 52 82, 58 76 Z" fill="#fde7c9"/>
  </g>
  <!-- legs -->
  <rect x="38" y="97" width="12" height="15" rx="6" fill="url(#skin)"/>
  <rect x="56" y="99" width="12" height="13" rx="6" fill="url(#skin)"/>
  <path d="M38 109 h12 M56 109 h12" stroke="#c9692e" stroke-width="1.5" opacity=".6"/>

  <g class="head">
    <path d="M54 66 C 50 46, 60 28, 82 25 C 102 22, 117 31, 117 45 C 117 56, 109 62, 97 62 L 80 63 C 76 71, 66 75, 57 73 Z" fill="url(#skin)"/>
    <ellipse cx="96" cy="52" rx="5" ry="3" fill="#f08a6a" opacity=".55"/>
    <path class="smile" d="M100 55 q 7 2.5 13 -2.5" fill="none" stroke="#8a4520" stroke-width="2.4" stroke-linecap="round"/>
    <path class="mouth-open" d="M99 53.5 q 8 7 16 -3 q -7 1 -16 3 z" fill="#5c2415"/>
    <ellipse cx="111" cy="38" rx="1.4" ry="1.8" fill="#8a4520"/>
    <g class="eye">
      <circle cx="88" cy="40" r="6.2" fill="#fff"/>
      <circle cx="90" cy="41" r="3.4" fill="#1c1411"/>
      <circle cx="91.3" cy="39.5" r="1.2" fill="#fff"/>
    </g>
    <path d="M81 32 q 6 -4 13 -1" fill="none" stroke="#9a4f23" stroke-width="2.2" stroke-linecap="round"/>

    <!-- fire breath -->
    <g class="fire">
      <ellipse class="puff" cx="118" cy="52" rx="10" ry="7" fill="url(#flame)"/>
      <ellipse class="puff" cx="118" cy="53" rx="8" ry="6" fill="url(#flame)"/>
      <ellipse class="puff" cx="118" cy="51" rx="6" ry="4.5" fill="#ff8a3d"/>
      <ellipse class="puff" cx="117" cy="52" rx="6" ry="4.5" fill="#fff3b0"/>
    </g>
  </g>

  <!-- arm + cup (handle faces the dino so it can hold it) -->
  <g class="arm">
    <path d="M90 80 h 24 v 11 a 12 12 0 0 1 -12 12 a 12 12 0 0 1 -12 -12 z" fill="#fbf4ec"/>
    <path d="M90 84 h -3.5 a 5.5 5.5 0 0 0 0 11 h 4" fill="none" stroke="#fbf4ec" stroke-width="3.2"/>
    <ellipse cx="102" cy="80.5" rx="12" ry="2.8" fill="#5c2f17"/>
    <ellipse cx="102" cy="80.2" rx="6" ry="1.2" fill="#c98a55" opacity=".9"/>
    <g class="steam">
      <path d="M104 75 c -2 -2.5, 3 -4, 1 -6.5" fill="none" stroke="#f8c47e" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M111 76 c -2 -2.5, 3 -4, 1 -6.5" fill="none" stroke="#f8c47e" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <path d="M70 83 q 5 5 11 5" fill="none" stroke="url(#skin)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M81 86.5 q 4 -1.5 6.5 -4 M81 90 q 4 0.5 6.5 -1.5" fill="none" stroke="#e3894a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
